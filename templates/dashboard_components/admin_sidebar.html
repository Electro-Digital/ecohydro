<script>
// Enhanced sidebar dropdown behavior
document.addEventListener('DOMContentLoaded', function() {
    const submenuItems = document.querySelectorAll('.has-submenu');
    const regularMenuItems = document.querySelectorAll('.menu-item:not(.has-submenu)');
    
    submenuItems.forEach(item => {
        item.addEventListener('click', function(e) {
            e.preventDefault();
            const submenu = this.nextElementSibling;
            const isExpanded = this.classList.contains('expanded');
            
            // Toggle current submenu
            if (isExpanded) {
                this.classList.remove('expanded');
                if (submenu) submenu.classList.remove('expanded');
            } else {
                this.classList.add('expanded');
                if (submenu) submenu.classList.add('expanded');
            }
        });
    });
    
    // Only collapse when clicking non-submenu items
    regularMenuItems.forEach(item => {
        item.addEventListener('click', function() {
            // Collapse all submenus when navigating to non-submenu pages
            submenuItems.forEach(submenuItem => {
                submenuItem.classList.remove('expanded');
                const submenu = submenuItem.nextElementSibling;
                if (submenu) submenu.classList.remove('expanded');
            });
        });
    });
});
</script>
